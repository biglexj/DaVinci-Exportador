# Configuración de tareas de DaVinci Exportador mediante Mise
# Reutiliza el estándar común: dev, build, check, test, release, publish

[tasks.dev]
raw_args = true
description = "Ejecutar DaVinci Exportador en desarrollo (Flet Desktop)"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Generar el ejecutable de escritorio (PyInstaller) sin generar instalador"
file = "scripts/mise-task.ts"

[tasks.check]
raw_args = true
description = "Verificar sintaxis, importación y contratos sin generar artefactos"
file = "scripts/mise-task.ts"

[tasks.test]
raw_args = true
description = "Ejecutar las pruebas unitarias del motor y de la capa de servicio"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "Generar instalador oficial Inno Setup en release/ sin publicar"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "Publicar release en GitHub y sincronizar ficha en Aurora (--plan y --check sin escritura)"
file = "scripts/mise-task.ts"
